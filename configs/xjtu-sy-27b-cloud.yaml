# XJTU-SY 回放 + PyTRiO Qwen3.8-27B 做策略决策，记录到 SwanLab 云端。
# 凭据来自本机 PyTRiO 登录态（pytrio_access），不写入配置文件。
seed: 42
model:
  default_kind: lightgbm
  alt_kind: ridge
  random_state: 42
  params:
    n_estimators: 80
    num_leaves: 15
    n_jobs: 2
gate:
  min_gain_rel: 0.02
  max_drop_rel: 0.10
harness:
  enabled: true
  credential_source: pytrio
  base_url: https://pytrio.com/api/openai/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B
  small_model: Qwen/Qwen3.8-27B
  max_tokens: 128
  timeout_s: 90
  retries: 0
budget:
  max_llm_tokens: 10000
  max_compute_seconds: 3600
  bootstrap_timeout_s: 120
  action_timeout_s: 60
log:
  backend: swanlab
  workspace: hequan
  project: zhixunyinqing
  out_dir: runs/xjtu-sy-27b
  swanlab_mode: online
playbook_path: null
