# PyTRiO 赛题指定 Qwen3.8-27B 的 Gas 本机对照。
seed: 42
model:
  default_kind: lightgbm
  alt_kind: logreg
  random_state: 42
  params:
    n_estimators: 80
    num_leaves: 15
    n_jobs: 2
harness:
  enabled: true
  credential_source: pytrio
  base_url: https://pytrio.com/api/openai/v1
  api_key: EMPTY
  model: Qwen/Qwen3.8-27B
  small_model: Qwen/Qwen3.8-27B
  max_tokens: 128
  timeout_s: 90
  retries: 0
budget:
  max_llm_tokens: 10000
  max_compute_seconds: 3600
  bootstrap_timeout_s: 120
  action_timeout_s: 60
log:
  backend: swanlab
  workspace: hequan
  project: zhixunyinqing
  swanlab_mode: online
  out_dir: runs/gas-pytrio-27b
playbook_path: null
